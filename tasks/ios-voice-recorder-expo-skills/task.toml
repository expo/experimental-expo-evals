schema_version = "1.4"

[metadata]
display_name = "iOS Voice Recorder · Expo skills"
default_sandbox = "eas-production"

[[artifacts]]
source = "/app"
destination = "app"
exclude = ["**/node_modules/**", "**/.git/**", "**/.env*", "**/.expo/**", "**/.npm/**", "**/ios/**", "**/android/**", "**/build/**", "**/DerivedData/**", "**/*.app/**", "**/*.log"]

[agent]
timeout_sec = 1800

[verifier]
timeout_sec = 600

[verifier.env]
TYPESAFE_API_KEY = "${TYPESAFE_API_KEY}"

[environment]
skills_dir = "/app/.agents/skills"
build_timeout_sec = 900

[[environment.mcp_servers]]
name = "argent"
transport = "stdio"
command = "argent"
args = ["mcp"]
