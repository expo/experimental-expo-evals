[project]
name = "eas-simulator-evals"
version = "0.1.0"
description = "One Harbor task with a RewardKit rubric"
requires-python = ">=3.12"
dependencies = [
    "harbor[e2b]==0.23.0",
    "harbor-rewardkit[jev] @ git+https://github.com/harbor-framework/harbor.git@404bae708cf284f4c6ed054422ad4f5b2aca764f#subdirectory=packages/rewardkit",
]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["e2b_environment", "eas_environment"]
packages = ["eas_provider"]

[tool.setuptools.package-data]
eas_provider = ["*.sh", "*.yml"]
